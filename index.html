<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Perfilado del Buyer Persona · Doc ROI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      .docroi-info {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 19px;
        height: 19px;
        margin-left: 7px;
        border-radius: 50%;
        background: #05070b;
        color: #fff;
        font-size: 12px;
        line-height: 1;
        font-weight: 900;
        cursor: help;
        flex: 0 0 auto;
      }
      .docroi-info::before {
        content: "i";
      }
      .docroi-info::after {
        content: attr(data-help);
        position: absolute;
        left: 50%;
        bottom: calc(100% + 10px);
        z-index: 80;
        width: min(330px, 78vw);
        transform: translateX(-50%) translateY(4px);
        padding: 12px 14px;
        border: 1px solid rgba(216,236,248,.2);
        border-radius: 14px;
        background: rgba(5,7,11,.88);
        color: #fff;
        box-shadow: 0 18px 42px rgba(0,0,0,.28);
        font-size: 12px;
        line-height: 1.45;
        font-weight: 700;
        text-transform: none;
        letter-spacing: 0;
        white-space: normal;
        text-align: left;
        opacity: 0;
        pointer-events: none;
        transition: opacity .16s ease, transform .16s ease;
      }
      .docroi-info:hover::after,
      .docroi-info:focus::after {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .docroi-field-note {
        margin: 8px 0 0;
        color: #5b6472;
        font-size: 12px;
        line-height: 1.45;
        font-weight: 700;
      }
      .docroi-coverage-field {
        border: 1px solid #d8ecf8;
        border-radius: 18px;
        background: #f6fbfe;
        padding: 16px;
      }
      .docroi-coverage-field input[type="range"] {
        width: 100%;
        accent-color: #003b5c;
      }
      .docroi-coverage-value {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 54px;
        height: 32px;
        border-radius: 999px;
        background: #003b5c;
        color: #fff;
        font-weight: 900;
      }
      .docroi-hidden-coverage {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__DOCROI_TITLE__ = "Sistema de Perfilado del Buyer Persona";

      var docroiHelp = {
        "Proyecto": "Indica el nombre del caso, marca, asignatura, negocio o iniciativa para la que estás construyendo este Buyer Persona.",
        "Producto o gama": "Describe la solución, servicio, programa, producto o familia de productos que quieres analizar.",
        "Sector": "Sitúa el mercado de referencia: educación, salud, retail, banca, SaaS, turismo, consultoría, etc.",
        "Mercado": "Define el alcance geográfico o competitivo: España, LATAM, B2B, B2C, premium, universitario, local, internacional.",
        "Objetivo de negocio": "Explica qué decisión quieres mejorar: captar, convertir, fidelizar, automatizar, posicionar, monetizar o reducir incertidumbre.",
        "% consumidores representados": "Estima qué parte de tu público total representa este perfil. No tiene que ser exacto: sirve para priorizar su importancia estratégica.",
        "Nombre ficticio": "Crea un nombre simple para recordar el perfil. No debe ser una persona real, sino una etiqueta humana para trabajar mejor.",
        "Generación digital": "Elige el contexto cultural y tecnológico que mejor explica su relación con canales, confianza, formatos y decisión.",
        "Descripción ejecutiva": "Redacta entre 60 y 75 palabras: cómo es, qué necesita, cómo decide, qué canales usa y qué formatos de contenido le activan.",
        "Edad": "Puedes usar una edad aproximada o rango: 35-44, 45-55, joven profesional, directivo senior, estudiante de máster, etc.",
        "Género": "Indica si el perfil tiene una orientación de género relevante o escribe mixto/no determinante si no condiciona la estrategia.",
        "Ubicación": "No es solo ciudad. Puedes indicar país, región, entorno urbano/rural, mercado principal o contexto cultural donde consume y decide.",
        "Responsabilidad principal": "Describe su papel en la decisión: compra, recomienda, aprueba presupuesto, usa la solución, enseña, dirige equipo o influye internamente."
      };

      function updateDocRoiBuyerTitle() {
        document.title = "Sistema de Perfilado del Buyer Persona · Doc ROI";
        document.querySelectorAll("h1, h2").forEach(function (node) {
          var text = (node.textContent || "").trim();
          if (text === "Sistema premium de inteligencia de Buyer Persona" || text === "Generación Perfil Buyer Persona con IA") {
            node.textContent = window.__DOCROI_TITLE__;
          }
        });
      }

      function currentBuilderStep() {
        var title = document.querySelector(".builder-head h2");
        return title ? title.textContent.trim() : "";
      }

      function addHelpIcon(labelSpan, labelText) {
        if (!labelSpan || labelSpan.querySelector(".docroi-info")) return;
        var help = docroiHelp[labelText];
        if (!help) return;
        var icon = document.createElement("span");
        icon.className = "docroi-info";
        icon.tabIndex = 0;
        icon.setAttribute("role", "button");
        icon.setAttribute("aria-label", "Ayuda: " + labelText);
        icon.setAttribute("data-help", help);
        labelSpan.appendChild(icon);
      }

      function addFieldNote(label, text) {
        if (!label || label.querySelector(".docroi-field-note")) return;
        var note = document.createElement("small");
        note.className = "docroi-field-note";
        note.textContent = text;
        label.appendChild(note);
      }

      function enhanceFields() {
        document.querySelectorAll("label.field, label.slider").forEach(function (label) {
          var span = label.querySelector(":scope > span");
          if (!span) return;
          var text = span.childNodes[0] ? span.childNodes[0].textContent.trim() : span.textContent.trim();
          addHelpIcon(span, text);

          var input = label.querySelector("input, textarea, select");
          if (!input) return;
          if (docroiHelp[text]) input.setAttribute("title", docroiHelp[text]);

          if (text === "Ubicación") {
            input.setAttribute("placeholder", "Ej.: España, LATAM, Madrid urbano, mercado B2B internacional...");
            addFieldNote(label, "Piensa en el contexto donde decide y consume, no solo en una dirección física.");
          }
          if (text === "Responsabilidad principal") {
            input.setAttribute("placeholder", "Ej.: decide la compra, recomienda, usa, aprueba presupuesto o influye...");
            addFieldNote(label, "Aclara qué poder real tiene dentro del proceso de decisión.");
          }
          if (text === "Descripción ejecutiva") {
            input.setAttribute("placeholder", "60-75 palabras sobre conducta, canales, formatos de contenido, confianza y decisión.");
            addFieldNote(label, "Incluye canales principales y modalidad de contenido: video, email, LinkedIn, demo, informe, webinar, comparativa, etc.");
          }
        });
      }

      function tuneWelcomeAndIdentityCopy() {
        var step = currentBuilderStep();
        var paragraph = document.querySelector(".wizard-card .form-section > p");
        if (step === "Bienvenida" && paragraph) {
          paragraph.textContent = "Contexto mínimo para enfocar el caso: proyecto, producto, sector, mercado y objetivo de negocio. Aquí no se perfila todavía a la persona; se delimita el escenario estratégico.";
        }
        if (step === "Identidad" && paragraph) {
          paragraph.textContent = "Caracteriza el perfil que representa una parte relevante del mercado: quién es, qué papel cumple, dónde decide, cómo consume contenido y qué canales le generan confianza.";
        }
      }

      function hideWelcomeCoverage() {
        var step = currentBuilderStep();
        document.querySelectorAll("label.slider").forEach(function (label) {
          var span = label.querySelector(":scope > span");
          var text = span && span.childNodes[0] ? span.childNodes[0].textContent.trim() : "";
          if (text === "% consumidores representados" && step === "Bienvenida") {
            label.classList.add("docroi-hidden-coverage");
          } else if (text === "% consumidores representados") {
            label.classList.remove("docroi-hidden-coverage");
          }
        });
      }

      function insertIdentityCoverage() {
        if (currentBuilderStep() !== "Identidad") return;
        var grid = document.querySelector(".wizard-card .form-grid");
        if (!grid || grid.querySelector(".docroi-coverage-field")) return;
        var store = window.__docroiPersonaStore;
        var data = store && store.getState ? store.getState().data : {};
        var value = Number(data.coverage || 25);

        var field = document.createElement("label");
        field.className = "field docroi-coverage-field";
        field.innerHTML = '<span>% consumidores representados <span class="docroi-info" tabindex="0" role="button" aria-label="Ayuda: porcentaje" data-help="' + docroiHelp["% consumidores representados"] + '"></span></span><input type="range" min="1" max="100" value="' + value + '"><small class="docroi-field-note">Estima el peso de este perfil dentro del público objetivo. Ayuda a saber si es un perfil central, secundario o exploratorio.</small><strong class="docroi-coverage-value">' + value + '%</strong>';
        var input = field.querySelector("input");
        var output = field.querySelector(".docroi-coverage-value");
        input.addEventListener("input", function () {
          var n = Number(input.value);
          output.textContent = n + "%";
          if (window.__docroiPersonaStore && window.__docroiPersonaStore.getState) {
            window.__docroiPersonaStore.getState().update("coverage", n);
          }
        });
        grid.insertBefore(field, grid.firstChild);
      }

      function applyDocRoiEnhancements() {
        updateDocRoiBuyerTitle();
        tuneWelcomeAndIdentityCopy();
        enhanceFields();
        hideWelcomeCoverage();
        insertIdentityCoverage();
      }

      window.addEventListener("DOMContentLoaded", function () {
        applyDocRoiEnhancements();
        setTimeout(applyDocRoiEnhancements, 100);
        setTimeout(applyDocRoiEnhancements, 500);
        setTimeout(applyDocRoiEnhancements, 1200);
        var root = document.getElementById("root");
        if (root) {
          new MutationObserver(function () {
            window.requestAnimationFrame(applyDocRoiEnhancements);
          }).observe(root, { childList: true, subtree: true });
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
