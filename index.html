<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generacion Perfil Buyer Persona con IA · Doc ROI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      .empathy-framing { color: #101820; }
      .empathy-framing * { box-sizing: border-box; }
      .empathy-framing .frame-label {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        margin-bottom: 8px;
        padding: 5px 9px;
        border-radius: 999px;
        background: #eef4f7;
        color: #111827;
        font-size: 10px;
        font-weight: 900;
        letter-spacing: .02em;
        text-transform: uppercase;
      }
      .empathy-framing h4 {
        margin: 0 0 8px;
        color: #05070b;
        font-size: 20px;
        line-height: 1.08;
        font-weight: 950;
        letter-spacing: 0;
      }
      .empathy-framing > p {
        margin: 0 0 12px;
        color: #334155;
        font-size: 12px;
        line-height: 1.45;
      }
      .empathy-framing .empathy-persona {
        display: grid;
        grid-template-columns: 76px 1fr;
        gap: 12px;
        align-items: center;
        margin: 12px 0;
        border: 1px solid #e1e7ef;
        border-radius: 16px;
        background: #05070b;
        padding: 10px;
        color: #fff;
      }
      .empathy-framing .empathy-persona img {
        width: 76px;
        height: 76px;
        object-fit: cover;
        border-radius: 14px;
        display: block;
      }
      .empathy-framing .empathy-persona strong,
      .empathy-framing .empathy-persona p,
      .empathy-framing .empathy-persona small { color: #fff !important; }
      .empathy-framing .empathy-persona strong {
        display: block;
        font-size: 13px;
        font-weight: 900;
        margin-bottom: 3px;
      }
      .empathy-framing .empathy-persona p {
        margin: 0;
        font-size: 12px;
        line-height: 1.35;
      }
      .empathy-framing .empathy-persona small {
        display: block;
        margin-top: 5px;
        font-size: 10px;
        font-weight: 800;
        opacity: .82;
      }
      .empathy-framing .empathy-frame-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: 12px;
      }
      .empathy-framing article {
        border: 1px solid #dce7ef;
        border-radius: 14px;
        background: #fff;
        padding: 12px;
        box-shadow: 0 8px 18px rgba(15, 23, 42, .05);
      }
      .empathy-framing article > strong {
        display: block;
        color: #05070b;
        font-size: 14px;
        line-height: 1.2;
        font-weight: 950;
        margin-bottom: 9px;
      }
      .empathy-framing .logic-block {
        padding: 9px;
        border-radius: 11px;
        background: #f7fafc;
        border: 1px solid #e8eef5;
      }
      .empathy-framing .logic-block + .logic-block { margin-top: 8px; }
      .empathy-framing .logic-block.docroi { background: #fffaf0; border-color: #f4dfb7; }
      .empathy-framing .logic-block small {
        display: block;
        margin-bottom: 6px;
        color: #111827;
        font-size: 10px;
        line-height: 1.2;
        font-weight: 950;
        text-transform: uppercase;
        letter-spacing: .03em;
      }
      .empathy-framing ul {
        margin: 0;
        padding-left: 16px;
        color: #263241;
        font-size: 11.5px;
        line-height: 1.38;
      }
      .empathy-framing li + li { margin-top: 3px; }
      .empathy-framing .frame-objective {
        margin-top: 12px;
        border-radius: 15px;
        background: #05070b;
        color: #fff;
        padding: 13px;
      }
      .empathy-framing .frame-objective strong,
      .empathy-framing .frame-objective p { color: #fff !important; }
      .empathy-framing .frame-objective strong {
        display: block;
        margin-bottom: 5px;
        font-size: 13px;
        font-weight: 950;
      }
      .empathy-framing .frame-objective p {
        margin: 0;
        font-size: 11.5px;
        line-height: 1.42;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__DOCROI_GENERATION_IMAGES__ = {
        "Baby Boomer digital": "https://docroi.marketing/wp-content/uploads/2026/06/Baby-Boomers-1946-–-1964.png",
        "Baby Boomers": "https://docroi.marketing/wp-content/uploads/2026/06/Baby-Boomers-1946-–-1964.png",
        "Generación X digital": "https://docroi.marketing/wp-content/uploads/2026/06/Generacion-X-1965-–-1980.png",
        "Generacion X digital": "https://docroi.marketing/wp-content/uploads/2026/06/Generacion-X-1965-–-1980.png",
        "Generación X": "https://docroi.marketing/wp-content/uploads/2026/06/Generacion-X-1965-–-1980.png",
        "Millennial": "https://docroi.marketing/wp-content/uploads/2026/06/Millennials-o-Generacion-Y-1981-–-1996.png",
        "Millennials": "https://docroi.marketing/wp-content/uploads/2026/06/Millennials-o-Generacion-Y-1981-–-1996.png",
        "Generación Z": "https://docroi.marketing/wp-content/uploads/2026/06/Centennials-1997-–-2012.png",
        "Generacion Z": "https://docroi.marketing/wp-content/uploads/2026/06/Centennials-1997-–-2012.png",
        "Centennials": "https://docroi.marketing/wp-content/uploads/2026/06/Centennials-1997-–-2012.png",
        "Alpha emergente": "https://docroi.marketing/wp-content/uploads/2026/06/Generacion-Alfa-2013-–-presente.png",
        "Generación Alfa": "https://docroi.marketing/wp-content/uploads/2026/06/Generacion-Alfa-2013-–-presente.png",
        "Generacion Alfa": "https://docroi.marketing/wp-content/uploads/2026/06/Generacion-Alfa-2013-–-presente.png"
      };

      function docroiSetTitle() {
        document.title = "Generacion Perfil Buyer Persona con IA · Doc ROI";
        document.querySelectorAll("h1").forEach(function (node) {
          var text = (node.textContent || "").trim();
          if (text === "Sistema premium de inteligencia de Buyer Persona" || text === "Sistema de Perfilado del Buyer Persona") {
            node.textContent = "Generacion Perfil Buyer Persona con IA";
          }
        });
      }

      function docroiGenerationKey(text) {
        var map = window.__DOCROI_GENERATION_IMAGES__;
        return Object.keys(map).find(function (key) { return (text || "").indexOf(key) !== -1; }) || "Millennial";
      }

      function docroiGenerationImageFor(text) {
        return window.__DOCROI_GENERATION_IMAGES__[docroiGenerationKey(text)];
      }

      function docroiFixGenerationImages() {
        document.querySelectorAll(".generation-profile, .generation-note, .final-persona-sheet header").forEach(function (box) {
          var img = box.querySelector("img");
          if (!img) return;
          var src = docroiGenerationImageFor(box.textContent || "");
          if (src && img.src !== src) img.src = src;
        });
      }

      function docroiCurrentGenerationText() {
        var selected = document.querySelector("select");
        if (selected && selected.value && window.__DOCROI_GENERATION_IMAGES__[selected.value]) return selected.value;
        var profile = document.querySelector(".generation-profile, .generation-note");
        return profile ? profile.textContent || "" : "Millennial";
      }

      function docroiList(items) {
        return "<ul>" + items.map(function (item) { return "<li>" + item + "</li>"; }).join("") + "</ul>";
      }

      function docroiEmpathyFrameHtml() {
        var generationText = docroiCurrentGenerationText();
        var image = docroiGenerationImageFor(generationText);
        var name = (document.querySelector('.generation-profile h4') || {}).textContent || generationText || "Buyer Persona";
        var channels = (document.querySelector('.generation-profile small') || {}).textContent || "Canales y contexto digital pendientes";
        var items = [
          {
            title: "1 · Qué piensa",
            classic: ["¿Qué piensa?", "¿Qué necesita?", "¿Qué le preocupa?"],
            docroi: ["¿Qué piensa sobre el producto?", "¿Qué piensa sobre el precio?", "¿Qué considera caro o barato?", "¿Qué ROI espera?"]
          },
          {
            title: "2 · Qué siente",
            classic: ["¿Qué siente?", "¿Qué emociones tiene?", "¿Qué le motiva?"],
            docroi: ["¿Qué siente sobre el producto?", "¿Qué sensación le transmite la marca?", "¿Qué inseguridad tiene?", "¿Qué satisfacción espera?"]
          },
          {
            title: "3 · Qué ve",
            classic: ["¿Qué ve?", "¿Qué le rodea?", "¿Qué influencias observa?"],
            docroi: ["Relacionarlo con canales.", "¿Qué redes sociales utiliza?", "¿Qué plataformas consulta?", "¿Dónde descubre productos o servicios?"]
          },
          {
            title: "4 · Qué escucha",
            classic: ["¿Qué escucha?", "¿Quién influye en él?", "¿Qué mensajes recibe?"],
            docroi: ["Relacionarlo con contenido.", "¿Qué contenidos consume?", "¿Qué formatos le generan confianza?", "¿Qué influencers o expertos sigue?"]
          },
          {
            title: "5 · Qué dice",
            classic: ["¿Qué dice?", "¿Cómo expresa sus opiniones?"],
            docroi: ["Relacionarlo con promoción.", "¿Qué recomendaría?", "¿Qué argumentos utiliza?", "¿Qué mensajes compartiría?"]
          },
          {
            title: "6 · Qué hace",
            classic: ["¿Qué hace?", "¿Cómo actúa?", "¿Cómo se comporta?"],
            docroi: ["Relacionarlo con distribución.", "¿Dónde compra?", "¿Cómo compara?", "¿Compra online o físico?", "¿Qué recorrido hace antes de decidir?"]
          },
          {
            title: "7 · Pains",
            classic: ["Adaptación DOC ROI: renombrar esfuerzos como pains."],
            docroi: ["¿Qué le frustra?", "¿Qué miedo tiene?", "¿Qué barreras encuentra?", "¿Qué le genera dolor o dificultad?"]
          },
          {
            title: "8 · Gains",
            classic: ["Adaptación DOC ROI: renombrar resultados como gains."],
            docroi: ["¿Qué quiere conseguir?", "¿Qué considera éxito?", "¿Qué beneficio espera?", "¿Qué mejora desea obtener?"]
          }
        ];
        return '<div class="empathy-framing" data-docroi-frame="empathy"><span class="frame-label">Documento maestro · DOC ROI</span><h4>Framing del mapa de empatía</h4><p>Herramienta simple, visual y pedagógica para ayudar al alumno a entender cómo piensa una persona, cómo siente, cómo decide, cómo consume y cómo se relaciona con productos, contenidos y marcas.</p><div class="empathy-persona"><img src="' + image + '" alt="' + name + '"><div><strong>' + name + '</strong><p>Usa el rostro como ancla visual del perfil. La clave no es rellenar campos sueltos, sino construir una hipótesis humana conectada con conducta, necesidad y negocio.</p><small>' + channels + '</small></div></div><div class="empathy-frame-grid">' + items.map(function (item) {
          return '<article><strong>' + item.title + '</strong><div class="logic-block"><small>Mapa de empatía clásico</small>' + docroiList(item.classic) + '</div><div class="logic-block docroi"><small>Aportación DOC ROI</small>' + docroiList(item.docroi) + '</div></article>';
        }).join('') + '</div><div class="frame-objective"><strong>Objetivo para el alumno</strong><p>Pensar mejor su buyer persona, entender comportamiento, conectar empatía con negocio y preparar posteriormente contenidos, promociones, pricing y automatización, sin convertir esta sección en una consultoría compleja.</p></div></div>';
      }

      function docroiEnhanceEmpathyFeed() {
        var step = (document.querySelector(".builder-head h2") || {}).textContent || "";
        var isEmpathy = /empat/i.test(step);
        document.querySelectorAll('[data-docroi-frame="empathy"]').forEach(function (node) {
          if (!isEmpathy) node.remove();
        });
        if (!isEmpathy) return;
        var frame = document.querySelector(".summary-panel .education-frame");
        if (!frame) return;
        if (!document.querySelector('[data-docroi-frame="empathy"]')) {
          frame.innerHTML = docroiEmpathyFrameHtml();
        }
      }

      function docroiRenameSlider(label, from, to) {
        var span = label.querySelector("span");
        if (!span) return;
        Array.from(span.childNodes).forEach(function (node) {
          if (node.nodeType === 3 && node.textContent.indexOf(from) !== -1) node.textContent = node.textContent.replace(from, to);
        });
      }

      function docroiEnhancePurchase() {
        var step = (document.querySelector(".builder-head h2") || {}).textContent || "";
        if (!/compra/i.test(step)) return;
        var section = document.querySelector(".wizard-card .form-section");
        if (!section) return;
        var intro = section.querySelector(":scope > p");
        if (intro) intro.textContent = "Primero marca las señales principales. Después, debajo, encontrarás la explicación pedagógica de cada variable.";
        var grid = section.querySelector(".form-grid.two");
        var help = section.querySelector(".variable-help");
        if (grid && help && grid.nextElementSibling !== help) grid.insertAdjacentElement("afterend", help);
        section.querySelectorAll("label.slider").forEach(function (label) {
          var raw = (label.querySelector("span") || {}).textContent || "";
          if (raw.indexOf("Prueba social") !== -1) label.remove();
          if (raw.indexOf("Sensibilidad precio") !== -1) docroiRenameSlider(label, "Sensibilidad precio", "Sensibilidad");
          if (raw.indexOf("Satisfacción") !== -1 && raw.indexOf("Satisfacción esperada") === -1) docroiRenameSlider(label, "Satisfacción", "Satisfacción esperada");
          if (raw.indexOf("Monetización") !== -1 && raw.indexOf("Monetización potencial") === -1) docroiRenameSlider(label, "Monetización", "Monetización potencial");
          if (raw.indexOf("Relación reciente") !== -1) docroiRenameSlider(label, "Relación reciente", "Relación previa");
        });
        if (help) {
          var copy = {
            "Urgencia": "Nivel de rapidez con el que necesita resolver el problema. Si duele hoy, el mensaje debe ser directo y fácil de comprobar.",
            "Sensibilidad": "Peso del precio, del riesgo o del esfuerzo en la decisión. Si es alta, explica valor, garantías y coste de no actuar.",
            "Confianza": "Prueba o validación que necesita antes de comprar: casos, testimonios, autoridad, demo o recomendación.",
            "Frecuencia": "Cada cuánto consume, compra, evalúa o necesita este tipo de solución.",
            "Satisfacción esperada": "Experiencia mínima para sentir que ha valido la pena: claridad, rapidez, resultado, acompañamiento o autonomía.",
            "Monetización potencial": "Capacidad del perfil para generar ingresos, recurrencia, recomendación o valor futuro.",
            "Relación previa": "Último contacto, experiencia o vínculo con una solución parecida. Indica si hay que educar desde cero o continuar una conversación."
          };
          help.querySelectorAll("article").forEach(function (article) {
            var titleNode = article.querySelector("strong");
            var bodyNode = article.querySelector("p");
            var title = (titleNode || {}).textContent || "";
            if (title === "Prueba social") article.remove();
            if (title === "Satisfacción" && titleNode) { titleNode.textContent = "Satisfacción esperada"; title = "Satisfacción esperada"; }
            if (title === "Monetización" && titleNode) { titleNode.textContent = "Monetización potencial"; title = "Monetización potencial"; }
            if (title === "Relación" && titleNode) { titleNode.textContent = "Relación previa"; title = "Relación previa"; }
            if (copy[title] && bodyNode) bodyNode.textContent = copy[title];
          });
        }
      }

      function docroiEnhanceBuyerPersona() {
        docroiSetTitle();
        docroiFixGenerationImages();
        docroiEnhanceEmpathyFeed();
        docroiEnhancePurchase();
      }

      window.addEventListener("DOMContentLoaded", function () {
        docroiEnhanceBuyerPersona();
        setTimeout(docroiEnhanceBuyerPersona, 250);
        setTimeout(docroiEnhanceBuyerPersona, 900);
        var root = document.getElementById("root");
        if (root) {
          new MutationObserver(function () {
            window.requestAnimationFrame(docroiEnhanceBuyerPersona);
          }).observe(root, { childList: true, subtree: true, characterData: true });
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
